name: Cleanup B2 - FORCE REMOVE HIDDEN

on:
  workflow_dispatch:

env:
  B2_BUCKET: ${{ secrets.B2_BUCKET_NAME }}
  B2_ARCHIVE_NAME: hermes-data.tar.gz

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 1. Install rclone
        run: |
          curl -sSL https://rclone.org/install.sh | sudo bash
          echo "✅ rclone version: $(rclone version | head -1)"

      - name: 2. Configure rclone for B2
        env:
          B2_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          mkdir -p ~/.config/rclone
          {
            echo "[b2]"
            echo "type = b2"
            echo "account = $B2_KEY_ID"
            echo "key = $B2_APP_KEY"
          } > ~/.config/rclone/rclone.conf
          echo "✅ rclone configured"

      - name: 3. Show Current State BEFORE Cleanup
        run: |
          echo "=========================================="
          echo "📊 BEFORE CLEANUP - Bucket contents:"
          echo "=========================================="
          
          echo ""
          echo "📁 Visible files (current version):"
          rclone ls b2:$B2_BUCKET/ 2>/dev/null | head -20 || echo "  (empty)"
          
          echo ""
          echo "📁 Hidden files (old versions):"
          rclone ls b2:$B2_BUCKET/ --b2-versions 2>/dev/null | head -50 || echo "  (none)"
          
          echo ""
          echo "📊 Total size (all versions):"
          rclone size b2:$B2_BUCKET/ --b2-versions 2>/dev/null || echo "  (error)"
          
          echo ""
          echo "📊 Current version size:"
          rclone size b2:$B2_BUCKET/ 2>/dev/null || echo "  (error)"

      - name: 4. CLEANUP ALL HIDDEN VERSIONS (THE MAGIC!)
        run: |
          echo "=========================================="
          echo "🧹 RUNNING: rclone cleanup b2:$B2_BUCKET/"
          echo "=========================================="
          echo ""
          echo "This will:"
          echo "  ✅ Remove ALL hidden (old) versions"
          echo "  ✅ Keep current version of files intact"
          echo "  ✅ Free up space from version accumulation"
          echo ""
          
          if rclone cleanup b2:$B2_BUCKET/; then
            echo ""
            echo "✅✅✅ CLEANUP SUCCESSFUL! ✅✅✅"
          else
            echo ""
            echo "❌ Cleanup failed!"
            exit 1
          fi

      - name: 5. Show State AFTER Cleanup
        run: |
          echo ""
          echo "=========================================="
          echo "📊 AFTER CLEANUP - Bucket contents:"
          echo "=========================================="
          
          echo ""
          echo "📁 Visible files:"
          rclone ls b2:$B2_BUCKET/ 2>/dev/null | head -20 || echo "  (empty)"
          
          echo ""
          echo "📁 Hidden files (should be empty):"
          rclone ls b2:$B2_BUCKET/ --b2-versions 2>/dev/null | head -50 || echo "  (none)"
          
          echo ""
          echo "📊 Total size now:"
          rclone size b2:$B2_BUCKET/ --b2-versions 2>/dev/null || echo "  (error)"
          
          echo ""
          echo "📊 Current version size:"
          rclone size b2:$B2_BUCKET/ 2>/dev/null || echo "  (error)"

      - name: 6. Final Summary
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║         🎉 CLEANUP COMPLETED!                           ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          echo "✅ All old (hidden) versions deleted"
          echo "✅ Current files preserved"
          echo "✅ B2 storage freed up"
          echo ""
          echo "🔗 Check B2 dashboard:"
          echo "   https://secure.backblaze.com/b2_buckets.htm"
