name: Hermes WebUI (Release Storage)

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Duration in hours (max 6)'
        required: false
        default: '6'
      sync_interval_min:
        description: 'Sync interval in minutes'
        required: false
        default: '30'

env:
  DATA_REPO: hhgghhjgg/Hermes-pre
  CODE_REPO: hhgghhjgg/Hermes-on

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    
    steps:
      # ============================================================
      # STEP 1: Checkout code repository
      # ============================================================
      - name: 1. Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # STEP 2: Verify token access to BOTH repositories
      # ============================================================
      - name: 2. Verify Token Access
        env:
          GH_TOKEN: ${{ secrets.HERMES_GH_TOKEN }}
        run: |
          echo "=========================================="
          echo "🔑 Step 2: Verifying token access..."
          echo "=========================================="
          echo "GitHub CLI version: $(gh --version | head -1)"
          echo ""
          
          # Test access to code repo
          echo "📦 Checking access to CODE repo ($CODE_REPO)..."
          if gh repo view "$CODE_REPO" > /dev/null 2>&1; then
            echo "  ✅ Code repo: ACCESSIBLE"
          else
            echo "  ❌ Code repo: NOT ACCESSIBLE"
            echo "  Fix: Ensure HERMES_GH_TOKEN has 'repo' scope"
            exit 1
          fi
          
          # Test access to data repo
          echo "📦 Checking access to DATA repo ($DATA_REPO)..."
          if gh repo view "$DATA_REPO" > /dev/null 2>&1; then
            echo "  ✅ Data repo: ACCESSIBLE"
          else
            echo "  ❌ Data repo: NOT ACCESSIBLE"
            echo "  Fix: Ensure HERMES_GH_TOKEN has access to $DATA_REPO"
            exit 1
          fi
          
          echo ""
          echo "✅ Token has access to both repositories"

      # ============================================================
      # STEP 3: Restore data from latest GitHub Release (1 request!)
      # ============================================================
      - name: 3. Restore Data from Latest Release
        env:
          GH_TOKEN: ${{ secrets.HERMES_GH_TOKEN }}
        run: |
          echo "=========================================="
          echo "📦 Step 3: Restoring data from Release..."
          echo "=========================================="
          
          # Find latest release in data repo
          LATEST_RELEASE=$(gh release list --repo "$DATA_REPO" --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          
          if [ -z "$LATEST_RELEASE" ]; then
            echo "ℹ️ No previous release found"
            echo "ℹ️ Starting fresh - data will be saved to Release on shutdown"
            sudo mkdir -p /data/.hermes
            sudo chown -R $(whoami) /data/.hermes
            exit 0
          fi
          
          echo "📥 Found release: $LATEST_RELEASE"
          echo "⬇️  Downloading hermes-data.tar.gz (ONE FILE = 3500 files)..."
          
          # Download the archive
          mkdir -p /tmp/backup
          gh release download "$LATEST_RELEASE" \
            --repo "$DATA_REPO" \
            --pattern "hermes-data.tar.gz" \
            --dir /tmp/backup
          
          # Extract to /data/.hermes
          echo "📂 Extracting files..."
          sudo mkdir -p /data/.hermes
          sudo chown -R $(whoami) /data/.hermes
          tar -xzf /tmp/backup/hermes-data.tar.gz -C /data/.hermes
          
          # Count restored files
          FILE_COUNT=$(find /data/.hermes -type f 2>/dev/null | wc -l)
          echo ""
          echo "✅ Restored $FILE_COUNT files from single archive"
          echo ""
          echo "📊 Directory sizes:"
          du -sh /data/.hermes/* 2>/dev/null | sort -rh | head -10 || echo "  (empty)"
          
          # Cleanup temp files
          rm -rf /tmp/backup

      # ============================================================
      # STEP 4: Build Docker image
      # ============================================================
      - name: 4. Build Docker Image
        run: |
          echo "🔨 Building Docker image..."
          docker build -t hermes-webui:latest .
          echo "✅ Image built successfully"

      # ============================================================
      # STEP 5: Start Hermes WebUI container
      # ============================================================
      - name: 5. Start Hermes Container
        env:
          GITHUB_TOKEN: ${{ secrets.HERMES_GH_TOKEN }}
          HERMES_WEBUI_PASSWORD: ${{ secrets.HERMES_WEBUI_PASSWORD }}
          HERMES_WEBUI_HOST: "0.0.0.0"
          HERMES_WEBUI_PORT: "8787"
          OMNIROUTE_URL: ${{ secrets.OMNIROUTE_URL }}
          HERMES_WEBUI_DEFAULT_MODEL: ${{ secrets.HERMES_WEBUI_DEFAULT_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          echo "🐳 Starting Hermes container..."
          
          # Get docker socket group ID for Docker-out-of-Docker
          DOCKER_SOCK_GID=$(stat -c '%g' /var/run/docker.sock)
          echo "Docker socket GID: $DOCKER_SOCK_GID"
          
          # Run container with pre-loaded data
          docker run -d \
            --restart on-failure \
            --name hermes-webui \
            -p 8787:8787 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /data:/data \
            --group-add $DOCKER_SOCK_GID \
            -e HERMES_WEBUI_PASSWORD="$HERMES_WEBUI_PASSWORD" \
            -e HERMES_WEBUI_HOST="$HERMES_WEBUI_HOST" \
            -e HERMES_WEBUI_PORT="$HERMES_WEBUI_PORT" \
            -e OMNIROUTE_URL="$OMNIROUTE_URL" \
            -e HERMES_WEBUI_DEFAULT_MODEL="$HERMES_WEBUI_DEFAULT_MODEL" \
            -e GEMINI_API_KEY="$GEMINI_API_KEY" \
            -e OPENROUTER_API_KEY="$OPENROUTER_API_KEY" \
            -e ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            -e OPENAI_API_KEY="$OPENAI_API_KEY" \
            -e DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY" \
            -e GITHUB_SYNC_DISABLED=true \
            hermes-webui:latest
          
          echo "⏳ Waiting 60 seconds for WebUI to start..."
          sleep 60
          
          # Health check
          echo ""
          echo "🏥 Running health check..."
          if curl -f -s http://localhost:8787/health > /dev/null 2>&1; then
            echo ""
            echo "✅✅✅ HERMES WEBUI IS RUNNING! ✅✅✅"
            echo ""
            curl -s http://localhost:8787/health | jq . || true
          else
            echo "❌ WebUI failed to start!"
            echo ""
            echo "Last 50 lines of logs:"
            docker logs hermes-webui --tail 50
            exit 1
          fi

      # ============================================================
      # STEP 6: Install Cloudflared for public URL
      # ============================================================
      - name: 6. Install Cloudflared
        run: |
          echo "🌐 Installing Cloudflared..."
          curl -sL -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          echo "✅ Cloudflared installed"

      # ============================================================
      # STEP 7: Start Cloudflare Tunnel
      # ============================================================
      - name: 7. Start Cloudflare Tunnel
        run: |
          echo "🚀 Starting Cloudflare Tunnel..."
          nohup ./cloudflared tunnel --url http://localhost:8787 > /tmp/cloudflared.log 2>&1 &
          sleep 15
          
          URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" /tmp/cloudflared.log | head -1)
          
          echo ""
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║         🎉 HERMES WEBUI IS READY!                       ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          echo "  🌐 URL:      $URL"
          echo "  🔑 Password: (set in GitHub Secrets)"
          echo "  💾 Storage:  GitHub Release ($DATA_REPO)"
          echo "  🐳 Docker:   Enabled (Docker-out-of-Docker)"
          echo ""
          echo "╚══════════════════════════════════════════════════════════╝"

      # ============================================================
      # STEP 8: Keep Alive + Sync Loop
      # ============================================================
      - name: 8. Keep Alive & Periodic Sync
        env:
          GH_TOKEN: ${{ secrets.HERMES_GH_TOKEN }}
          DURATION_HOURS: ${{ github.event.inputs.duration_hours || '6' }}
          SYNC_INTERVAL: ${{ github.event.inputs.sync_interval_min || '30' }}
        run: |
          echo "=========================================="
          echo "🔄 Starting keep-alive loop..."
          echo "=========================================="
          echo "Duration:        $DURATION_HOURS hours"
          echo "Sync interval:   $SYNC_INTERVAL minutes"
          echo ""
          
          TOTAL_MINUTES=$((DURATION_HOURS * 60))
          SYNC_COUNT=0
          
          # Function to sync data to GitHub Release
          sync_to_release() {
            local RELEASE_NAME="backup-$(date +%Y%m%d-%H%M%S)"
            local ARCHIVE_PATH="/tmp/hermes-data-$RELEASE_NAME.tar.gz"
            
            echo ""
            echo "┌────────────────────────────────────┐"
            echo "│  📦 SYNC #$((SYNC_COUNT + 1)) starting...    │"
            echo "└────────────────────────────────────┘"
            
            # Create archive from /data/.hermes
            echo "  ⏳ Creating archive..."
            tar -czf "$ARCHIVE_PATH" \
              -C /data/.hermes \
              --exclude='.git' \
              --exclude='node_modules' \
              --exclude='__pycache__' \
              --exclude='*.pyc' \
              --exclude='cache/*.log' \
              --exclude='webui/sessions/_run_journal' \
              . 2>/dev/null || true
            
            local ARCHIVE_SIZE=$(du -h "$ARCHIVE_PATH" | cut -f1)
            echo "  ✅ Archive created: $ARCHIVE_SIZE"
            
            # Create new release
            echo "  🚀 Creating release: $RELEASE_NAME"
            if gh release create "$RELEASE_NAME" \
              "$ARCHIVE_PATH" \
              --repo "$DATA_REPO" \
              --title "Backup $(date '+%Y-%m-%d %H:%M:%S')" \
              --notes "Automated backup - $(find /data/.hermes -type f 2>/dev/null | wc -l) files"; then
              echo "  ✅ Release created successfully"
              SYNC_COUNT=$((SYNC_COUNT + 1))
            else
              echo "  ❌ Failed to create release"
            fi
            
            # Cleanup local archive
            rm -f "$ARCHIVE_PATH"
            
            # Keep only last 5 releases (cleanup old ones)
            echo "  🧹 Cleaning up old releases..."
            OLD_RELEASES=$(gh release list --repo "$DATA_REPO" --limit 100 --json tagName -q '.[5:] | .[].tagName' 2>/dev/null || true)
            for old in $OLD_RELEASES; do
              echo "    Deleting: $old"
              gh release delete "$old" --repo "$DATA_REPO" --yes --cleanup-tag 2>/dev/null || true
            done
            
            echo "  ✅ Sync #$SYNC_COUNT completed"
          }
          
          # Main loop - every minute for TOTAL_MINUTES
          for i in $(seq 1 $TOTAL_MINUTES); do
            sleep 60
            
            # Check container health
            if ! docker ps | grep -q hermes-webui; then
              echo "❌ Container died! Restarting..."
              docker start hermes-webui 2>/dev/null || true
              sleep 10
            fi
            
            # Check WebUI health
            if curl -f -s http://localhost:8787/health > /dev/null 2>&1; then
              echo "[$i/$TOTAL_MINUTES] $(date '+%H:%M:%S') ✅ Healthy"
            else
              echo "[$i/$TOTAL_MINUTES] $(date '+%H:%M:%S') ⚠️  Health check failed"
            fi
            
            # Check cloudflared
            if ! pgrep -f cloudflared > /dev/null; then
              echo "⚠️  Cloudflared died! Restarting..."
              nohup ./cloudflared tunnel --url http://localhost:8787 > /tmp/cloudflared-restart.log 2>&1 &
              sleep 5
            fi
            
            # Sync every SYNC_INTERVAL minutes
            if [ $((i % SYNC_INTERVAL)) -eq 0 ]; then
              sync_to_release
            fi
            
            # Show detailed stats every 30 minutes
            if [ $((i % 30)) -eq 0 ]; then
              echo ""
              echo "========== Containers =========="
              docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
              echo ""
            fi
          done
          
          echo ""
          echo "✅ Keep-alive loop completed"
          echo "📊 Total syncs performed: $SYNC_COUNT"

      # ============================================================
      # STEP 9: Final Sync (always runs, even on failure)
      # ============================================================
      - name: 9. Final Sync on Shutdown
        if: always()
        env:
          GH_TOKEN: ${{ secrets.HERMES_GH_TOKEN }}
        run: |
          echo "=========================================="
          echo "💾 FINAL SYNC - Saving all data..."
          echo "=========================================="
          
          # Stop container gracefully
          echo "🛑 Stopping Hermes container..."
          docker stop hermes-webui 2>/dev/null || true
          sleep 5
          
          RELEASE_NAME="final-$(date +%Y%m%d-%H%M%S)"
          ARCHIVE_PATH="/tmp/hermes-data-final.tar.gz"
          
          # Create final archive
          echo "📦 Creating final archive..."
          tar -czf "$ARCHIVE_PATH" \
            -C /data/.hermes \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            . 2>/dev/null || true
          
          ARCHIVE_SIZE=$(du -h "$ARCHIVE_PATH" | cut -f1)
          echo "✅ Final archive created: $ARCHIVE_SIZE"
          
          # Create final release
          echo "🚀 Creating final release: $RELEASE_NAME"
          gh release create "$RELEASE_NAME" \
            "$ARCHIVE_PATH" \
            --repo "$DATA_REPO" \
            --title "Final Backup $(date '+%Y-%m-%d %H:%M:%S')" \
            --notes "Final backup - $(find /data/.hermes -type f 2>/dev/null | wc -l) files"
          
          echo "✅ Final sync completed!"
          
          # Cleanup
          rm -f "$ARCHIVE_PATH"
