name: Hermes + 9Router (B2 Storage)

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: Duration in hours
        required: false
        default: '6'
      sync_interval_min:
        description: Sync interval in minutes
        required: false
        default: '10'

env:
  B2_BUCKET: ${{ secrets.B2_BUCKET_NAME }}
  B2_ARCHIVE_NAME: hermes-data.tar.gz
  ROUTER_ARCHIVE_NAME: 9router-data.tar.gz

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 420

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install rclone
        run: |
          curl -sSL https://rclone.org/install.sh | sudo bash
          rclone version | head -1

      - name: Configure rclone for B2
        env:
          B2_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          mkdir -p ~/.config/rclone
          printf '[b2]\ntype = b2\naccount = %s\nkey = %s\n' "$B2_KEY_ID" "$B2_APP_KEY" > ~/.config/rclone/rclone.conf
          rclone lsd b2: > /dev/null 2>&1 || { echo "B2 connection failed"; exit 1; }
          rclone lsd b2: | grep -q "$B2_BUCKET" || { echo "Bucket not found"; exit 1; }
          echo "B2 configured"

      - name: Restore Data from B2
        run: |
          sudo mkdir -p /data/.hermes /data/.9router
          sudo chown -R "$USER" /data/.hermes /data/.9router
          mkdir -p /tmp/hbackup /tmp/rbackup
          if rclone ls "b2:${B2_BUCKET}/${B2_ARCHIVE_NAME}" 2>/dev/null | grep -q .; then
            rclone copyto "b2:${B2_BUCKET}/${B2_ARCHIVE_NAME}" "/tmp/hbackup/${B2_ARCHIVE_NAME}"
            tar -xzf "/tmp/hbackup/${B2_ARCHIVE_NAME}" -C /data/.hermes
            echo "Hermes restored"
          else
            echo "No Hermes archive"
          fi
          if rclone ls "b2:${B2_BUCKET}/${ROUTER_ARCHIVE_NAME}" 2>/dev/null | grep -q .; then
            rclone copyto "b2:${B2_BUCKET}/${ROUTER_ARCHIVE_NAME}" "/tmp/rbackup/${ROUTER_ARCHIVE_NAME}"
            tar -xzf "/tmp/rbackup/${ROUTER_ARCHIVE_NAME}" -C /data/.9router
            echo "9Router restored"
          else
            echo "No 9Router archive"
          fi
          rm -rf /tmp/hbackup /tmp/rbackup

      - name: Build Hermes Docker Image
        run: docker build -t hermes-webui:latest .

      - name: Create Docker Network
        run: docker network create hermes-net || true

      - name: Start Hermes Container
        env:
          HERMES_WEBUI_PASSWORD: ${{ secrets.HERMES_WEBUI_PASSWORD }}
          OMNIROUTE_URL: ${{ secrets.OMNIROUTE_URL }}
          HERMES_WEBUI_DEFAULT_MODEL: ${{ secrets.HERMES_WEBUI_DEFAULT_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          DOCKER_SOCK_GID=$(stat -c '%g' /var/run/docker.sock)
          docker run -d --restart on-failure --name hermes-webui --network hermes-net -p 8787:8787 -v /var/run/docker.sock:/var/run/docker.sock -v /data:/data --group-add "${DOCKER_SOCK_GID}" -e HERMES_WEBUI_PASSWORD -e HERMES_WEBUI_HOST=0.0.0.0 -e HERMES_WEBUI_PORT=8787 -e OMNIROUTE_URL -e HERMES_WEBUI_DEFAULT_MODEL -e GEMINI_API_KEY -e OPENROUTER_API_KEY -e ANTHROPIC_API_KEY -e OPENAI_API_KEY -e DEEPSEEK_API_KEY -e GITHUB_SYNC_DISABLED=true hermes-webui:latest
          sleep 60
          curl -sf http://localhost:8787/health || { docker logs hermes-webui --tail 50; exit 1; }
          echo "Hermes is running"

      - name: Start 9Router Container
        run: |
          docker run -d --restart on-failure --name 9router --network hermes-net -p 20128:20128 -v /data/.9router:/app/data decolua/9router:latest
          sleep 45
          docker logs --tail 30 9router || true
          curl -sf http://localhost:20128 > /dev/null 2>&1 && echo "9Router OK" || echo "9Router not ready yet"

      - name: Write Nginx Config File
        run: |
          mkdir -p /tmp/nginx-config
          python3 -c "
          c  = 'server {\n'
          c += '  listen 8080;\n'
          c += '  server_name _;\n'
          c += '  location / {\n'
          c += '    proxy_pass http://hermes-webui:8787;\n'
          c += '    proxy_http_version 1.1;\n'
          c += '    proxy_set_header Host \$host;\n'
          c += '    proxy_set_header X-Real-IP \$remote_addr;\n'
          c += '    proxy_buffering off;\n'
          c += '  }\n'
          c += '  location /9route/ {\n'
          c += '    proxy_pass http://9router:20128/;\n'
          c += '    proxy_http_version 1.1;\n'
          c += '    proxy_set_header Host \$host;\n'
          c += '    proxy_set_header X-Real-IP \$remote_addr;\n'
          c += '    proxy_buffering off;\n'
          c += '  }\n'
          c += '  location /9route-api/ {\n'
          c += '    proxy_pass http://9router:20128/;\n'
          c += '    proxy_http_version 1.1;\n'
          c += '    proxy_set_header Host \$host;\n'
          c += '    proxy_set_header X-Real-IP \$remote_addr;\n'
          c += '    proxy_buffering off;\n'
          c += '  }\n'
          c += '}\n'
          open('/tmp/nginx-config/nginx.conf','w').write(c)
          print('Nginx config written')
          "
          cat /tmp/nginx-config/nginx.conf

      - name: Start Nginx Container
        run: |
          docker run -d --restart on-failure --name nginx-proxy --network hermes-net -p 8080:8080 -v /tmp/nginx-config/nginx.conf:/etc/nginx/conf.d/default.conf:ro nginx:alpine
          sleep 15
          curl -sf http://localhost:8080/ > /dev/null 2>&1 || { docker logs nginx-proxy --tail 20; exit 1; }
          echo "Nginx is running"

      - name: Install Cloudflared
        run: |
          curl -sL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

      - name: Start Cloudflare Tunnel
        run: |
          nohup ./cloudflared tunnel --url http://localhost:8080 > /tmp/cloudflared.log 2>&1 &
          sleep 15
          URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" /tmp/cloudflared.log | head -1)
          echo "=========================================="
          echo "ALL SERVICES READY"
          echo "=========================================="
          echo "Hermes WebUI   ${URL}"
          echo "9Router Panel  ${URL}/9route/"
          echo "9Router API    ${URL}/9route-api/v1"
          echo "=========================================="

      - name: Keep Alive and Sync
        env:
          DURATION_HOURS: ${{ github.event.inputs.duration_hours || '6' }}
          SYNC_INTERVAL: ${{ github.event.inputs.sync_interval_min || '10' }}
        run: |
          TOTAL_MINUTES=$((DURATION_HOURS * 60))
          SYNC_COUNT=0
          sync_to_b2() {
            echo "SYNC $((SYNC_COUNT + 1)) starting"
            tar -czf /tmp/hsync.tar.gz -C /data/.hermes --exclude='.git' --exclude='node_modules' --exclude='__pycache__' --exclude='*.pyc' . 2>/dev/null || true
            rclone copyto /tmp/hsync.tar.gz "b2:${B2_BUCKET}/${B2_ARCHIVE_NAME}" && echo "Hermes upload OK" || echo "Hermes upload failed"
            tar -czf /tmp/rsync2.tar.gz -C /data/.9router --exclude='.git' --exclude='node_modules' --exclude='__pycache__' --exclude='*.pyc' . 2>/dev/null || true
            rclone copyto /tmp/rsync2.tar.gz "b2:${B2_BUCKET}/${ROUTER_ARCHIVE_NAME}" && echo "9Router upload OK" || echo "9Router upload failed"
            rm -f /tmp/hsync.tar.gz /tmp/rsync2.tar.gz
            SYNC_COUNT=$((SYNC_COUNT + 1))
          }
          for i in $(seq 1 $TOTAL_MINUTES); do
            sleep 60
            for container in hermes-webui 9router nginx-proxy; do
              if ! docker ps | grep -q "$container"; then
                echo "$container died, restarting"
                docker start "$container" 2>/dev/null || true
                sleep 5
              fi
            done
            curl -sf http://localhost:8787/health > /dev/null 2>&1 && echo "[$i/$TOTAL_MINUTES] Hermes OK" || echo "[$i/$TOTAL_MINUTES] Hermes FAIL"
            curl -sf http://localhost:20128 > /dev/null 2>&1 && echo "[$i/$TOTAL_MINUTES] 9Router OK" || echo "[$i/$TOTAL_MINUTES] 9Router FAIL"
            if ! pgrep -f cloudflared > /dev/null; then
              nohup ./cloudflared tunnel --url http://localhost:8080 > /tmp/cf2.log 2>&1 &
              sleep 5
            fi
            if [ $((i % SYNC_INTERVAL)) -eq 0 ]; then
              sync_to_b2
            fi
            if [ $((i % 30)) -eq 0 ]; then
              docker ps
              docker stats --no-stream
            fi
          done
          echo "Loop done. Syncs: $SYNC_COUNT"

      - name: Final Sync on Shutdown
        if: always()
        run: |
          docker stop hermes-webui 9router nginx-proxy 2>/dev/null || true
          sleep 5
          tar -czf /tmp/hfinal.tar.gz -C /data/.hermes --exclude='.git' --exclude='node_modules' --exclude='__pycache__' --exclude='*.pyc' . 2>/dev/null || true
          rclone copyto /tmp/hfinal.tar.gz "b2:${B2_BUCKET}/${B2_ARCHIVE_NAME}" || true
          tar -czf /tmp/rfinal.tar.gz -C /data/.9router --exclude='.git' --exclude='node_modules' --exclude='__pycache__' --exclude='*.pyc' . 2>/dev/null || true
          rclone copyto /tmp/rfinal.tar.gz "b2:${B2_BUCKET}/${ROUTER_ARCHIVE_NAME}" || true
          rm -f /tmp/hfinal.tar.gz /tmp/rfinal.tar.gz
          echo "Final sync done"
